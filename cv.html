<!DOCTYPE html>
<html>

<script>
    function redirect(href) {
        window.location.href = href
    }
</script>

<style>
    @import url('https://googleapis.com');
    
    body {
        min-height: 100vh;

        font-family: 'Roboto', sans-serif;
        color: #0d3232;
        background-color: whitesmoke;
        margin: 0px;
    }


    .layout {
        min-height: 100vh;
        max-width: 1280px;
        
        display: grid;
        grid-template-columns: 25% 75%;
        grid-template-areas: 
        'navbar navbar'
        'about-me content';
        
        margin: 0 auto;
    }

    
    .navbar {
        width: 100%;
        height: 100px;
        
        display: flex;
        justify-content: center;
        align-items: center;
        grid-area: navbar;
        
        position: fixed;
        top: 0;
        left: 0;
    }
    .navbar2 {
        width: 250px;
        height: 50%;
        
        display: flex;
        flex-direction: row;
        justify-content: space-around;
        align-items: center;

        background-color: brown;
        border-radius: 10px;
        border: 2px solid whitesmoke;
    }
    .navbar3 {
        height: 30px;
        width: 30px;

        display: flex;
        align-items: center;
        cursor: pointer;
    }
    .navbar img {
        max-width: 100%;
        max-height: 100%;
        object-fit: cover;
    }
    

    .about-me {
        width: min(100%, 320px);
        height: 100vh;
        
        display: flex;
        justify-content: center;
        align-items: center;
        grid-area: about-me;

        background-color: brown;
        top: 0;
        position: sticky;
        border: 10px;
        border-style: none solid none none;
        border-color: whitesmoke;
    }
    .about-me2 {
        margin: 5%;
        font-size: 24px;
    }


    .content {
        grid-area: content;
        grid-column: 2;

        /* border: 10px;
        border-style: none solid none none;
        border-color: brown; */
        background-color: brown;

        font-size: clamp(0.4rem, 5vw, 1.2rem);
    }
    .content > * {
        margin-inline: 50px;
    }
    

    .whitespace {
        height: 100px;
    }
</style>

<head>
    <title>Kjetil CV</title>
</head>

<body>
    <div class="layout">

        <div class="navbar">
            <div class="navbar2">
                <div class="navbar3" title="Home" onclick="redirect('./index.html')">
                    <img src="./imgs/home-icon.svg" alt="Home">
                </div>
                <div class="navbar3" title="Projects" onclick="redirect('./projects.html')">
                    <img src="./imgs/folder-icon.svg" alt="Projects">
                </div>
                <div class="navbar3" title="CV" onclick="redirect('./cv.html')">
                    <img src="./imgs//CV-icon.svg" alt="CV">
                </div>
                
            </div>
        </div>

        <div class="about-me">
            <div class="about-me2">
                <img src="./imgs/me.jpg" width="100%" style="border-radius: 50%; object-fit: cover;">
                <h2>Hei!</h2>
                <p>Kjetil, 26 år. Bachelor i Kognitiv Vitenskap. Yadi yadi. Her viser jeg prosjekter jeg jobber med!</p>
                <p id="about-me-p2">Målet med denne siden er å bygge den helt for hånd, ingen copy-paste fra KI!</p>
            </div>
        </div>

        <div class="content">

            <div class="whitespace"></div>
            
            

            

        

            
            <!-- <div style="width: 50px; height: 2000px; background-color: green; margin: 50px;"></div> -->

        </div>
    </div>
</body>

</html>
