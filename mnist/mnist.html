<body style="background-color: #333;">

    <div class="container">
        <div class="drawing-section">
            <canvas id='canvas' class="drawing-canvas" width="28" height="28"></canvas>
            <div class="drawing-board-controls">
                <button class="button" onclick="clearCanvas()">Empty</button>
            </div>
        </div>

        <div class="histogram-div">
            <canvas id="histogram" width="250" height="250"></canvas>
        </div>
    </div>

    <script>
        "use strict";

        // ONNX variables
        let session = null;

        // Drawing canvas variables
        const canvas = document.getElementById('canvas');
        const canvasCtx = canvas.getContext('2d');
        let isDrawing = false;

        showLoadingScreen();

        // Histogram variables
        const histogram = document.querySelector("#histogram");
        const histogramCtx = histogram.getContext("2d");

        async function init() {
            try {
                session = await ort.InferenceSession.create('./mnist.onnx');
                clearCanvas();  // clear when done loading
            }
            catch (e) {
                console.error(e);
            }
        }

        function prepareImageDataForInference() {
            const dims = [1, 1, 28, 28];
            let imgData = canvasCtx.getImageData(0, 0, canvas.width, canvas.height).data;
            let floatData = new Float32Array(28 * 28);
            for (let i = 0; i < imgData.length / 4; i++) {
                let colorValue = imgData[4 * i] / 255.0; 
                floatData[i] = colorValue;
            }
            let tensor = { input1: new ort.Tensor('float32', floatData, dims) };
            return tensor;
        }

        async function runInference() {
            if (!session) {
                console.warn('Model not done loading!');
                return;
            }
            const feed = prepareImageDataForInference();
            try {
                const results = await session.run(feed);
                drawHistogram(results.output1.data, 'red');
            }
            catch (e) {
                console.error('Error during inference:', e);
            }
        }

        async function pytorch_run() {
            try {
                // create a session
                const session = await ort.InferenceSession.create('./mnist.onnx');

                // prepare dummy data
                const dims = [1, 1, 28, 28];
                const size = dims[0] * dims[1] * dims[2] * dims[3];
                const inputData = Float32Array.from({ length: size }, () => Math.random());

                // prepare feeds
                const feeds = { input1: new ort.Tensor('float32', inputData, dims) };

                // feed inputs and run
                const results = await session.run(feeds);
                console.log(results.output1.data);
            }
            catch (e) {
                console.log(e);
            }
        }

        function startDrawing(e) {
            isDrawing = true;
            draw(e);
        }

        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            canvasCtx.beginPath();
            runInference();     // running model
        }

        function draw(e) {
            if (!isDrawing) return;

            const canvasRect = canvas.getBoundingClientRect();

            const scaleX = canvas.width / canvasRect.width;
            const scaleY = canvas.height / canvasRect.height;

            const x = (e.clientX - canvasRect.left) * scaleX;
            const y = (e.clientY - canvasRect.top) * scaleY;

            canvasCtx.lineWidth = 2;
            canvasCtx.lineCap = 'round';
            canvasCtx.strokeStyle = 'black';

            canvasCtx.lineTo(x, y);
            canvasCtx.stroke();
            canvasCtx.beginPath();
            canvasCtx.moveTo(x, y);
        }

        function clearCanvas() {
            canvasCtx.fillStyle = 'white';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            clearHistogram();
        }

        function fillCanvas(color) {
            canvasCtx.fillStyle = color;
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            clearHistogram();
        }

        function clearHistogram() {
            // Draw blank background
            histogramCtx.fillStyle = '#D1D1D1';
            histogramCtx.fillRect(0, 0, histogram.width, histogram.height);
            // Draw y-axis numbers
            histogramCtx.fillStyle = 'black';
            histogramCtx.font = 'italic 15pt Calibri';
            histogramCtx.textBaseline = 'top';
            const drawingX = 0;
            const extraYmargin = 3;
            for (let i = 0; i < 10; i++) {
                const drawingY = histogram.height * i / 10 + extraYmargin;
                histogramCtx.fillText(i, drawingX, drawingY);
            }
            // Draw vertical seperation line
            const marginToText = 25;
            histogramCtx.beginPath();
            histogramCtx.moveTo(marginToText, 0);
            histogramCtx.lineTo(marginToText, histogram.height);
            histogramCtx.stroke();
        }

        function drawHistogram(data, barcolor) {
            // drawHistogram2(data, barcolor);

            clearHistogram();
            // histogramCtx.save();
            // histogramCtx.font = 'italic 10pt Calibri';
            // histogramCtx.fillStyle = barcolor;

            // const barwidth = 250/10;
            // const canvasSize = 250;

            // var posX = 0;
            // var posY = 0;
            // for (var i=0; i < data.length; i++) {
            //     let barheight = data[i] * canvasSize;
            //     posX = 0;
            //     posY = i * barwidth;

            //     histogramCtx.fillRect(posX, posY, barheight, barwidth);
            //     histogramCtx.save();
            //     histogramCtx.fillStyle = 'black';

            //     histogramCtx.fillText(data[i], posX + barheight + 5, posY + 15);
            //     histogramCtx.restore();
            // }
            // histogramCtx.restore();
        }

        function drawHistogram2(data, barcolor) {
            clearHistogram();
            histogramCtx.save();
            histogramCtx.font = 'italic 10pt Calibri';
            histogramCtx.fillStyle = barcolor;

            const barwidth = 250/10;
            const canvasSize = 250;

            var posX = 0;
            var posY = 0;
            for (var i=0; i < data.length; i++) {
                let barheight = data[i] * canvasSize;
                posX = 0;
                posY = i * barwidth;

                histogramCtx.fillRect(posX, posY, barheight, barwidth);
                histogramCtx.save();
                histogramCtx.fillStyle = 'black';

                histogramCtx.fillText(data[i], posX + barheight + 5, posY + 15);
                histogramCtx.restore();
            }
            histogramCtx.restore();
        }

        function showLoadingScreen() {
            // TODO
            canvasCtx.fillStyle = '#AAAAAA';
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            canvasCtx.font = "8px sans-serif";
            canvasCtx.fillStyle = '#000000';
            canvasCtx.textAlign = 'center';
            canvasCtx.fillText("Loading", 14, 18);
        }

        // Add event listeners for mouse
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', () => {if (isDrawing) stopDrawing(); });

        init();
    </script>

</body>

</html>
